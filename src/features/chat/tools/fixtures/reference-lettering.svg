<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <title>Reference lettering redraw fixture — not an automatic trace</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#fff9df"/><stop offset="0.5" stop-color="#f2a830"/><stop offset="1" stop-color="#ce252b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feDropShadow dx="4" dy="6" stdDeviation="3" flood-color="#111111" flood-opacity="0.6"/></filter>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/><feFlood flood-color="#ffd100" result="color"/><feComposite in="color" in2="blur" operator="in" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="20" y="20" width="860" height="560" rx="48" fill="#ffffff" stroke="#171717" stroke-width="10"/>
  <g filter="url(#shadow)" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900">
    <text x="450" y="220" font-size="154" fill="url(#metal)" stroke="#111111" stroke-width="14" paint-order="stroke fill" letter-spacing="-5">BRAND</text>
    <text x="450" y="368" font-size="116" fill="#fd282b" stroke="#111111" stroke-width="12" paint-order="stroke fill" textLength="800" lengthAdjust="spacingAndGlyphs">50000 PUFFS</text>
    <text x="450" y="505" font-size="116" font-style="italic" fill="#96e842" stroke="#111111" stroke-width="10" paint-order="stroke fill" filter="url(#glow)">55 mL</text>
  </g>
</svg>
