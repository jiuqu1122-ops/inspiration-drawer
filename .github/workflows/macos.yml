name: macOS Preview

on:
  push:
    branches:
      - feat/macos-support
  pull_request:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build unsigned macOS ARM64
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust for Apple Silicon
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build unsigned app and DMG
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg --no-sign --ci

      - name: Upload unsigned macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inspiration-drawer-macos-arm64-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
