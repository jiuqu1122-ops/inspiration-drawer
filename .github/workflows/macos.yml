name: macOS Preview

on:
  push:
    branches:
      - feat/macos-support
  pull_request:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build ad-hoc-signed macOS ARM64 Preview
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust for Apple Silicon
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build ad-hoc-signed app, DMG, and updater archive
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg --ci

      - name: Verify updater archive and signature
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_ROOT="$GITHUB_WORKSPACE/src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          VERIFY_ROOT="$RUNNER_TEMP/inspiration-drawer-updater-verify"
          test "$(find "$BUNDLE_ROOT" -maxdepth 1 -type f -name '*.app.tar.gz' -print | wc -l | tr -d ' ')" = "1"
          UPDATER_ARCHIVE="$(find "$BUNDLE_ROOT" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$UPDATER_ARCHIVE"
          test -s "$UPDATER_ARCHIVE"
          test -s "$UPDATER_ARCHIVE.sig"

          rm -rf "$VERIFY_ROOT"
          mkdir -p "$VERIFY_ROOT"
          tar -xzf "$UPDATER_ARCHIVE" -C "$VERIFY_ROOT"
          EXTRACTED_APP="$(find "$VERIFY_ROOT" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$EXTRACTED_APP"
          codesign --verify --deep --strict --verbose=2 "$EXTRACTED_APP"
          SIGNATURE_DETAILS="$(codesign -dv --verbose=4 "$EXTRACTED_APP" 2>&1)"
          printf '%s\n' "$SIGNATURE_DETAILS"
          grep -F "Signature=adhoc" <<< "$SIGNATURE_DETAILS"

      - name: Create, sign, and verify Preview ZIP
        shell: bash
        run: |
          set -euo pipefail
          umask 022

          APP_SOURCE="$GITHUB_WORKSPACE/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Inspiration Drawer.app"
          STAGING_ROOT="$RUNNER_TEMP/inspiration-drawer-preview-staging"
          PREVIEW_DIR="$STAGING_ROOT/Inspiration-Drawer-macOS-Preview"
          ZIP_PATH="$GITHUB_WORKSPACE/Inspiration-Drawer-macOS-Preview.zip"
          VERIFY_ROOT="$RUNNER_TEMP/inspiration-drawer-preview-verify"
          STAGED_APP="$PREVIEW_DIR/Inspiration Drawer.app"
          STAGED_EXECUTABLE="$STAGED_APP/Contents/MacOS/inspiration-drawer"

          test "$(id -un)" != "root"
          test -d "$APP_SOURCE"
          bash -n "$GITHUB_WORKSPACE/scripts/macos/First Launch.command"
          rm -rf "$STAGING_ROOT" "$VERIFY_ROOT"
          rm -f "$ZIP_PATH"
          mkdir -p "$PREVIEW_DIR" "$VERIFY_ROOT"

          ditto "$APP_SOURCE" "$STAGED_APP"
          install -m 0755 "$GITHUB_WORKSPACE/scripts/macos/First Launch.command" "$PREVIEW_DIR/First Launch.command"
          install -m 0644 "$GITHUB_WORKSPACE/scripts/macos/README.txt" "$PREVIEW_DIR/README.txt"
          chmod 755 "$PREVIEW_DIR/First Launch.command"
          chmod 755 "$STAGED_EXECUTABLE"

          test -d "$STAGED_APP"
          test -x "$PREVIEW_DIR/First Launch.command"
          test -x "$STAGED_EXECUTABLE"
          test -r "$PREVIEW_DIR/README.txt"
          test "$(stat -f '%Sp' "$PREVIEW_DIR/First Launch.command")" = "-rwxr-xr-x"
          test "$(stat -f '%Sp' "$STAGED_EXECUTABLE")" = "-rwxr-xr-x"
          test "$(stat -f '%Sp' "$PREVIEW_DIR/README.txt")" = "-rw-r--r--"

          codesign --force --deep --sign - "$STAGED_APP"
          codesign --verify --deep --strict --verbose=2 "$STAGED_APP"

          SIGNATURE_DETAILS="$(codesign -dv --verbose=4 "$STAGED_APP" 2>&1)"
          printf '%s\n' "$SIGNATURE_DETAILS"
          grep -F "Signature=adhoc" <<< "$SIGNATURE_DETAILS"

          ls -la "$PREVIEW_DIR"
          ls -la "$STAGED_APP/Contents/MacOS"
          stat -f "%Sp %Su:%Sg %N" \
            "$PREVIEW_DIR" \
            "$STAGED_APP" \
            "$STAGED_EXECUTABLE" \
            "$PREVIEW_DIR/First Launch.command" \
            "$PREVIEW_DIR/README.txt"

          for STAGED_PATH in \
            "$PREVIEW_DIR" \
            "$STAGED_APP" \
            "$STAGED_EXECUTABLE" \
            "$PREVIEW_DIR/First Launch.command" \
            "$PREVIEW_DIR/README.txt"
          do
            test "$(stat -f '%Su' "$STAGED_PATH")" != "root"
          done
          if find "$PREVIEW_DIR" -user root -print -quit | grep -q .; then
            echo "Preview staging contains root-owned content" >&2
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$PREVIEW_DIR" "$ZIP_PATH"
          ditto -x -k "$ZIP_PATH" "$VERIFY_ROOT"

          EXTRACTED_PREVIEW="$VERIFY_ROOT/Inspiration-Drawer-macOS-Preview"
          EXTRACTED_APP="$EXTRACTED_PREVIEW/Inspiration Drawer.app"
          EXTRACTED_EXECUTABLE="$EXTRACTED_APP/Contents/MacOS/inspiration-drawer"

          test -d "$EXTRACTED_APP"
          test -x "$EXTRACTED_PREVIEW/First Launch.command"
          test -x "$EXTRACTED_EXECUTABLE"
          test -r "$EXTRACTED_PREVIEW/README.txt"
          test "$(stat -f '%Sp' "$EXTRACTED_PREVIEW/First Launch.command")" = "-rwxr-xr-x"
          test "$(stat -f '%Sp' "$EXTRACTED_EXECUTABLE")" = "-rwxr-xr-x"
          test "$(stat -f '%Sp' "$EXTRACTED_PREVIEW/README.txt")" = "-rw-r--r--"
          test ! -e "$EXTRACTED_PREVIEW/Inspiration-Drawer-macOS-Preview"
          test "$(find "$EXTRACTED_PREVIEW" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = "3"

          codesign --verify --deep --strict --verbose=2 "$EXTRACTED_APP"
          EXTRACTED_SIGNATURE_DETAILS="$(codesign -dv --verbose=4 "$EXTRACTED_APP" 2>&1)"
          printf '%s\n' "$EXTRACTED_SIGNATURE_DETAILS"
          grep -F "Signature=adhoc" <<< "$EXTRACTED_SIGNATURE_DETAILS"

          ls -la "$EXTRACTED_PREVIEW"
          ls -la "$EXTRACTED_APP/Contents/MacOS"
          stat -f "%Sp %Su:%Sg %N" \
            "$EXTRACTED_PREVIEW" \
            "$EXTRACTED_APP" \
            "$EXTRACTED_EXECUTABLE" \
            "$EXTRACTED_PREVIEW/First Launch.command" \
            "$EXTRACTED_PREVIEW/README.txt"

          for EXTRACTED_PATH in \
            "$EXTRACTED_PREVIEW" \
            "$EXTRACTED_APP" \
            "$EXTRACTED_EXECUTABLE" \
            "$EXTRACTED_PREVIEW/First Launch.command" \
            "$EXTRACTED_PREVIEW/README.txt"
          do
            test "$(stat -f '%Su' "$EXTRACTED_PATH")" != "root"
          done
          if find "$EXTRACTED_PREVIEW" -user root -print -quit | grep -q .; then
            echo "Extracted Preview contains root-owned content" >&2
            exit 1
          fi

          find "$EXTRACTED_PREVIEW" -maxdepth 2 -print

      - name: Upload macOS ARM64 Preview
        uses: actions/upload-artifact@v4
        with:
          name: inspiration-drawer-macos-arm64-preview
          if-no-files-found: error
          retention-days: 14
          path: Inspiration-Drawer-macOS-Preview.zip

      - name: Upload macOS ARM64 debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inspiration-drawer-macos-arm64-debug-artifacts
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publish Preview and updater to COS
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/macos-support'
        id: publish-cos
        run: node scripts/macos/publish-updater.mjs
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}

      - name: Verify published COS updater payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/macos-support'
        shell: bash
        env:
          ARCHIVE_URL: ${{ steps.publish-cos.outputs.archive_url }}
          MANIFEST_URL: ${{ steps.publish-cos.outputs.manifest_url }}
          SIGNATURE_URL: ${{ steps.publish-cos.outputs.signature_url }}
        run: |
          set -euo pipefail

          VERIFY_ROOT="$RUNNER_TEMP/inspiration-drawer-cos-updater-verify"
          rm -rf "$VERIFY_ROOT"
          mkdir -p "$VERIFY_ROOT"

          curl --fail --silent --show-error --location "$MANIFEST_URL?run=$GITHUB_RUN_ID" -o "$VERIFY_ROOT/latest.json"
          curl --fail --silent --show-error --location "$ARCHIVE_URL?run=$GITHUB_RUN_ID" -o "$VERIFY_ROOT/update.app.tar.gz"
          curl --fail --silent --show-error --location "$SIGNATURE_URL?run=$GITHUB_RUN_ID" -o "$VERIFY_ROOT/update.app.tar.gz.sig"
          node -e 'const fs=require("node:fs"); const manifest=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const platform=manifest.platforms?.["darwin-aarch64"]; if (!platform?.url || !platform?.signature || !platform?.sha256 || !platform?.size) process.exit(1)' "$VERIFY_ROOT/latest.json"
          test -s "$VERIFY_ROOT/update.app.tar.gz.sig"

          mkdir -p "$VERIFY_ROOT/extracted"
          tar -xzf "$VERIFY_ROOT/update.app.tar.gz" -C "$VERIFY_ROOT/extracted"
          EXTRACTED_APP="$(find "$VERIFY_ROOT/extracted" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$EXTRACTED_APP"
          codesign --verify --deep --strict --verbose=2 "$EXTRACTED_APP"
          SIGNATURE_DETAILS="$(codesign -dv --verbose=4 "$EXTRACTED_APP" 2>&1)"
          printf '%s\n' "$SIGNATURE_DETAILS"
          grep -F "Signature=adhoc" <<< "$SIGNATURE_DETAILS"

