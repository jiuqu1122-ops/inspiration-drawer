name: Sync Gitee desktop update index

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitee-desktop-update-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Gitee release and sync the fixed index
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: zibinyou
          GITEE_REPO: inspiration-drawer
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::GITEE_TOKEN is not configured. Skipping Gitee index sync."
            exit 0
          fi
          node scripts/sync-gitee-release.mjs --sync-latest
