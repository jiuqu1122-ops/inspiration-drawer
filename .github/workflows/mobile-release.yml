name: Publish mobile update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Mobile version without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  publish-mobile-update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      COS_REGION: ap-singapore
      COS_BUCKET: inspirationdrawer-1475663212

    steps:
      - name: Download staged mobile assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download mobile-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Inspiration-Drawer-Mobile-arm64.apk' \
            --pattern 'latest-mobile.json' \
            --dir release \
            --clobber

      - name: Validate staged release
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          apk_path = Path('release/Inspiration-Drawer-Mobile-arm64.apk')
          manifest_path = Path('release/latest-mobile.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          apk = manifest.get('apk') or {}
          actual_hash = hashlib.sha256(apk_path.read_bytes()).hexdigest()
          actual_size = apk_path.stat().st_size
          expected_version = os.environ['RELEASE_VERSION'].lstrip('v')
          assert manifest.get('schemaVersion') == 1
          assert str(manifest.get('version', '')).lstrip('v') == expected_version
          assert apk.get('architecture') == 'arm64-v8a'
          assert apk.get('sha256') == actual_hash
          assert apk.get('size') == actual_size
          print(f'Validated mobile {expected_version}: size={actual_size} sha256={actual_hash}')

      - name: Install Tencent COS SDK
        run: python -m pip install --disable-pip-version-check cos-python-sdk-v5==1.9.38

      - name: Publish APK and manifest to COS
        env:
          COS_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          from qcloud_cos import CosConfig, CosS3Client

          secret_id = os.environ.get('COS_SECRET_ID', '').strip()
          secret_key = os.environ.get('COS_SECRET_KEY', '').strip()
          if not secret_id or not secret_key:
              raise RuntimeError('Tencent COS release credentials are unavailable')

          client = CosS3Client(CosConfig(
              Region=os.environ['COS_REGION'],
              SecretId=secret_id,
              SecretKey=secret_key,
              Scheme='https',
          ))
          bucket = os.environ['COS_BUCKET']
          apk_path = Path('release/Inspiration-Drawer-Mobile-arm64.apk')
          manifest_path = Path('release/latest-mobile.json')

          # Publish the binary first and the manifest last. Clients never see a
          # new manifest that points at an APK which has not finished uploading.
          with apk_path.open('rb') as apk_file:
              client.put_object(
                  Bucket=bucket,
                  Key='mobile/Inspiration-Drawer-Mobile-arm64.apk',
                  Body=apk_file,
                  ContentType='application/vnd.android.package-archive',
                  CacheControl='private, max-age=300',
              )
          with manifest_path.open('rb') as manifest_file:
              client.put_object(
                  Bucket=bucket,
                  Key='mobile/latest-mobile.json',
                  Body=manifest_file,
                  ContentType='application/json; charset=utf-8',
                  CacheControl='no-cache',
              )

          apk_head = client.head_object(
              Bucket=bucket,
              Key='mobile/Inspiration-Drawer-Mobile-arm64.apk',
          )
          manifest_head = client.head_object(
              Bucket=bucket,
              Key='mobile/latest-mobile.json',
          )
          expected_apk_size = apk_path.stat().st_size
          expected_manifest_size = manifest_path.stat().st_size
          assert int(apk_head['Content-Length']) == expected_apk_size
          assert int(manifest_head['Content-Length']) == expected_manifest_size
          print(json.dumps({
              'apkBytes': expected_apk_size,
              'manifestBytes': expected_manifest_size,
              'published': True,
          }))

      - name: Verify production update endpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "https://api.unmind.art/v1/mobile/latest?verify=${GITHUB_RUN_ID}-${attempt}" \
              -o production-mobile.json
            if python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('production-mobile.json').read_text(encoding='utf-8'))
          staged = json.loads(Path('release/latest-mobile.json').read_text(encoding='utf-8'))
          raise SystemExit(0 if (
              str(manifest.get('version', '')).lstrip('v') == os.environ['RELEASE_VERSION'].lstrip('v')
              and manifest.get('apk', {}).get('sha256') == staged.get('apk', {}).get('sha256')
              and manifest.get('apk', {}).get('size') == staged.get('apk', {}).get('size')
          ) else 1)
          PY
            then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo 'Production mobile manifest did not update in time' >&2
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error --range 0-1023 \
            'https://api.unmind.art/v1/mobile/apk' \
            -o production-apk-prefix.bin
          test "$(wc -c < production-apk-prefix.bin)" -gt 0
